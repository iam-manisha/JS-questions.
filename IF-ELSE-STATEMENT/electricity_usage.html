<!-- 4. Electricity Usage Checker
Write a JavaScript program that accepts the number of electricity units consumed.
- If the units are less than or equal to 100, print "Low electricity consumption".
- Otherwise, print "High electricity consumption". -->

<!doctype html>
<html lang="en">
  <head>
    <script>
      let unit = Number(prompt("Enter the number of electricity units"));
      if (unit <= 100) {
        console.log("Low electricity consumption");
      } else {
        console.log("High electricity consumption");
      }
    </script>
  </head>
  <body>
    <h1><u>Electricity Usage Checker</u></h1>
  </body>
</html>
