<!-- 5. Voting Eligibility Write a JavaScript program that accepts a person's age. -
If the age is greater than or equal to 18, print "Eligible to vote". -
Otherwise, print "Not eligible to vote". -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting Eligibility Checker</title>
    <script>
      let age = Number(prompt("Enter your age"));
      if (age >= 18) {
        console.log("Eligible to vote");
      } else {
        console.log("Not eligible to vote");
      }
    </script>
  </head>
  <body>
    <h1>Vote Eligibility</h1>
  </body>
</html>
