<!--write a js program that accept an amount from user .if the amount is greater than or equal to 500 ,print
"you can get a 500 rupee note" -->

<!doctype html>
<html lang="en">
  <head>
    <script>
      let a = Number(prompt("Enter an amount"));
      if (a >= 500) {
        console.log("You can get a 500 rupee note");
      }
    </script>
  </head>
  <body>
    <h1><u>Currency Note Checker</u></h1>
  </body>
</html>
