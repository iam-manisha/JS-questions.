<!-- 3. Free Delivery Eligibility
Write a JavaScript program that accepts the total shopping amount. If the amount is greater than or equal to 1000, print "You are eligible for free delivery". -->
<!doctype html>
<html lang="en">
  <head>
    <script>
      let a = Number(prompt("Enter the total shopping amount"));
      if (a >= 1000) {
        console.log("You are eligible for free delivery");
      }
    </script>
  </head>
  <body>
    <h1><u>Free Delivery Eligibility Checker</u></h1>
  </body>
</html>
