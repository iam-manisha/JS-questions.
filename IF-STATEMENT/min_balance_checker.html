<!-- write a js program that accept a bank account balance .if the bank is less than 1000,print"maintain minimum balance". -->
<!doctype html>
<html lang="en">
  <head>
    <script>
      let a = Number(prompt("Enter your bank balance"));

      if (a < 1000) {
        console.log("Maintain minimum Balance");
      }
    </script>
  </head>
  <body>
    <h1><u>Minimum Balance Checker</u></h1>
  </body>
</html>
