<!-- 9. Student Grade Calculator Write a JavaScript program that accepts a student's
marks and displays the grade based on the following conditions: - If marks are
90 or above, print "Grade A". - If marks are 80 or above but less than 90, print
"Grade B". - If marks are 70 or above but less than 80, print "Grade C". - If
marks are 50 or above but less than 70, print "Grade D". - If marks are between
35 and 49, print "Grade E". - If marks are below 35, print "Fail". -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Calculator</title>
    <script>
      let mark = Number(prompt("Enter your mark"));

      if (mark >= 90) {
        console.log("Grade A");
      } else if (mark >= 80) {
        console.log("Grade B");
      } else if (mark >= 70) {
        console.log("Grade C");
      } else if (mark >= 50) {
        console.log("Grade D");
      } else if (mark >= 35) {
        console.log("Grade E");
      } else {
        console.log("Fail");
      }
    </script>
  </head>
  <body>
    <h1>Student Grade Calculator</h1>
  </body>
</html>
