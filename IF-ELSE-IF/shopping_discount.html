<!-- 7. Shopping Discount Calculator Write a JavaScript program that accepts the
total shopping bill and calculates the discount based on the following
conditions: - If the bill is less than ₹1,000, no discount is provided. - If the
bill is between ₹1,000 and ₹4,999, provide a 5% discount. - If the bill is
between ₹5,000 and ₹9,999, provide a 10% discount. - If the bill is ₹10,000 or
above, provide a 20% discount. Display the discount amount and the final bill
after deducting the discount. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Discount Calculator</title>
    <script>
      let bill = Number(prompt("Enter your total shopping bill amount"));
      let discount = 0;

      if (bill < 1000) {
        discount = 0;
        console.log("No Discount");
        console.log("Discount Amount:", discount);
        console.log("Total bill is", bill - discount);
      } else if (bill >= 1000 && bill <= 4999) {
        discount = (bill * 5) / 100;

        console.log("Discount Amount:", discount);
        console.log("Total bill is", bill - discount);
      } else if (bill >= 5000 && bill <= 9999) {
        discount = (bill * 10) / 100;
        console.log("Discount Amount:", discount);
        console.log("Total bill is", bill - discount);
      } else {
        discount = (bill * 20) / 100;
        console.log("Discount Amount:", discount);

        console.log("Total bill is", bill - discount);
      }
    </script>
  </head>
  <body>
    <h1>Shopping Discount Calculator</h1>
  </body>
</html>
